<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="manifest" href="/assets/manifest.json">
  <meta name="theme-color" content="#a64d57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mabayuan">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Admin Login — Mabayuan Express</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body { margin:0;min-height:100vh;background:linear-gradient(135deg,#4a1e24 0%,#6b2d35 40%,#8b3d46 70%,#5c2830 100%);display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;padding:20px;box-sizing:border-box; }
    .auth-bg { position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none; }
    .auth-bg::before { content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,.05);top:-150px;right:-100px; }
    .auth-bg::after { content:'';position:absolute;width:350px;height:350px;border-radius:50%;background:rgba(0,0,0,.1);bottom:-60px;left:-80px; }
    .auth-container { position:relative;z-index:1;width:100%;max-width:420px; }
    .auth-card { background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3); }
    .auth-head { background:linear-gradient(135deg,#4a1e24,#8b3d46);padding:28px 28px 24px;text-align:center;color:#fff; }
    .auth-logo { width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;box-shadow:0 4px 12px rgba(0,0,0,.2); }
    .auth-head h1 { margin:0;font-size:22px;font-weight:800; }
    .auth-head p { margin:6px 0 0;font-size:13px;opacity:.8; }
    .role-badge { display:inline-block;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:10px; }
    .auth-body { padding:26px 28px; }
    .error-banner { background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;display:none; }
    .form-label { display:block;font-size:12px;font-weight:700;color:#7a5a5d;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px; }
    .input { width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #e8d5d7;border-radius:10px;font-size:14px;color:#2d1518;background:#fdf8f8;transition:border-color .15s,box-shadow .15s;outline:none; }
    .input:focus { border-color:#8b3d46;box-shadow:0 0 0 3px rgba(139,61,70,.12); }
    .pw-wrap { position:relative; }
    .pw-wrap .input { padding-right:44px; }
    .toggle-pw { position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9a7a7d;padding:0;font-size:17px;line-height:1; }
    .btn-auth { width:100%;padding:13px;background:linear-gradient(135deg,#4a1e24,#8b3d46);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(74,30,36,.4);letter-spacing:.3px; }
    .btn-auth:hover { background:linear-gradient(135deg,#3a1620,#6b2d35);box-shadow:0 6px 20px rgba(74,30,36,.45);transform:translateY(-1px); }
    .auth-footer { text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid #f5eded; }
    .auth-footer a { color:#8b3d46;font-size:13px;font-weight:600;text-decoration:none; }
    .auth-footer p { margin:5px 0;font-size:13px;color:#9a7a7d; }
    .other-portals { margin-top:14px;padding:12px;background:#fdf8f8;border-radius:10px;border:1px solid #f0e4e5; }
    .other-portals p { font-size:11px;font-weight:700;color:#9a7a7d;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px; }
    .portal-links { display:flex;gap:8px;flex-wrap:wrap; }
    .portal-link { font-size:12px;color:#8b3d46;font-weight:600;text-decoration:none;padding:4px 10px;border:1px solid #e8c4c8;border-radius:20px;transition:.15s; }
    .portal-link:hover { background:#fce8ea; }
  </style>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo"><svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="3" width="20" height="26" rx="3" fill="rgba(255,255,255,0.28)"/>
  <path d="M20 3 L26 9 L20 9 Z" fill="rgba(255,255,255,0.2)"/>
  <path d="M20 3 L20 9 L26 9" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  <line x1="10" y1="14" x2="22" y2="14" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="18" x2="22" y2="18" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="17" y2="22" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="26" cy="28" r="7" fill="#fff"/>
  <polyline points="22.5,28 25,30.5 29.5,25.5" stroke="#8b2131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg></div>
      <h1>System Admin Login</h1>
      <p>System administrator control panel</p>
      <div class="role-badge">System Admin Portal</div>
    </div>
    <div class="auth-body">
      <div class="error-banner" id="errorBanner"></div>
      <form action="/auth/sysadmin/login" method="POST" autocomplete="off">
        <label class="form-label">Email address</label>
        <input class="input" type="email" name="email" required autocomplete="off" placeholder="your@email.com" style="margin-bottom:14px">
        <label class="form-label">Password</label>
        <div class="pw-wrap" style="margin-bottom:4px">
          <input class="input" type="password" name="password" id="pwField" required autocomplete="new-password" placeholder="Enter your password">
          <button class="toggle-pw" type="button" onclick="togglePw()">👁</button>
        </div>
        <button class="btn-auth" type="submit">Login</button>
      </form>
      <div class="auth-footer">
        <p><a href="/">← Back to home</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  function togglePw() {
    const inp = document.getElementById('pwField');
    const btn = inp.nextElementSibling;
    const hidden = inp.type === 'password';
    inp.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? '🙈' : '👁';
  }
  (function(){
    const err = new URLSearchParams(window.location.search).get('error');
    if (err) { const el=document.getElementById('errorBanner'); el.textContent=decodeURIComponent(err); el.style.display='block'; }

    // Show links to other portals (not current one)
    const portals = [
      { label:'Staff', href:'/login/staff' },
      { label:'Captain', href:'/login/captain' },
      { label:'System Admin', href:'/login/sysadmin' },
    ];
    const current = window.location.pathname;
    const container = document.getElementById('otherPortals');
    portals.forEach(function(p) {
      if (p.href === current) return;
      const a = document.createElement('a');
      a.href = p.href; a.className = 'portal-link'; a.textContent = p.label;
      container.appendChild(a);
    });
    // Also add resident link
    const r = document.createElement('a');
    r.href='/resident/login'; r.className='portal-link'; r.textContent='Resident';
    container.appendChild(r);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/assets/sw.js");
    });
  }
</script>
</body>
</html>
