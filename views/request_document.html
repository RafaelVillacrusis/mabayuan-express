<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <link rel="manifest" href="/assets/manifest.json">
  <meta name="theme-color" content="#a64d57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mabayuan">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Document</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="nav-overlay" id="navOverlay" onclick="closeNav()"></div>
    <header class="topbar">
      <div class="brand"><div class="brand-mark" style="background:transparent;padding:0;overflow:visible;"><svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="3" width="20" height="26" rx="3" fill="rgba(255,255,255,0.22)"/>
  <path d="M20 3 L26 9 L20 9 Z" fill="rgba(255,255,255,0.18)"/>
  <path d="M20 3 L20 9 L26 9" stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="none"/>
  <line x1="10" y1="14" x2="22" y2="14" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="18" x2="22" y2="18" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="22" x2="17" y2="22" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="26" cy="28" r="7" fill="#fff"/>
  <polyline points="22.5,28 25,30.5 29.5,25.5" stroke="#8b2131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg></div><div class="brand-copy"><div>Mabayuan Express</div><small>Resident request form</small></div></div>
      <button class="nav-toggle" id="navToggle" onclick="openNav()" aria-label="Open menu">☰</button>
      <nav class="top-links" id="topNav">
        <button class="nav-close" onclick="closeNav()" aria-label="Close menu">✕</button>
        
        <a href="/resident/dashboard">Dashboard</a>
        <a href="/resident/request">Request Document</a>
        <form action="/auth/logout" method="POST"><button class="btn btn-small btn-ghost">Logout</button></form>
      </nav>
    </header>
    <main class="container content-area">
      <section class="panel" style="max-width:860px;margin:0 auto;">
        <a href="/resident/dashboard" class="btn btn-small btn-ghost" style="margin-bottom:16px;">&larr; Back</a>
        <h1 style="margin-top:0">Request a Document</h1>
        <form action="/api/resident/requests" method="POST">
          <div class="form-grid">
            <div class="full">
              <label class="form-label">Document</label>
              <select class="select" id="documentSelect" name="document_id" required>
                <option value="">Select a document</option>
              </select>
            </div>
            <div>
              <label class="form-label">Price</label>
              <input class="input" id="documentPrice" disabled placeholder="Auto-filled">
            </div>
            <div>
              <label class="form-label">Estimated processing time</label>
              <input class="input" id="processingDays" disabled placeholder="Auto-filled">
            </div>
            <div class="full">
              <label class="form-label">Suggested release date</label>
              <input class="input" id="suggestedRelease" disabled placeholder="Auto-computed when request is created">
            </div>
            <div>
              <label class="form-label">Contact number</label>
              <input class="input" name="contact_number" required>
            </div>
            <div class="full">
              <label class="form-label">Purpose</label>
              <input class="input" name="purpose" required>
            </div>
            <div class="full">
              <label class="form-label">Additional details</label>
              <textarea class="textarea" name="purpose_details"></textarea>
            </div>
          </div>
          <div class="form-actions"><button class="btn">Submit request</button></div>
        </form>
      </section>
    </main>
  </div>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/request-document.js"></script>
<script>
(function(){
  // Block back button — replace history so back goes nowhere useful
  history.pushState(null, "", window.location.href);
  window.addEventListener("popstate", function() {
    history.pushState(null, "", window.location.href);
  });
  // If page is restored from browser cache (bfcache), verify session is still alive
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      fetch("/api/session-check", { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(d) { if (!d.ok) window.location.replace(d.redirect || "/resident/login"); })
        .catch(function() { window.location.replace("/resident/login"); });
    }
  });
})();
</script>
<script>
/* ── Mobile hamburger nav ── */
function openNav() {
  document.getElementById('topNav').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeNav() {
  var nav = document.getElementById('topNav');
  var overlay = document.getElementById('navOverlay');
  if (nav) nav.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
}
function closeNotif() {
  document.querySelectorAll('.notif-dropdown').forEach(function(d) {
    d.classList.remove('show');
  });
}
document.addEventListener('DOMContentLoaded', function() {
  // Close drawer when any nav link is tapped
  document.querySelectorAll('.top-links a').forEach(function(a) {
    a.addEventListener('click', closeNav);
  });
});
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/assets/sw.js");
    });
  }
</script>
</body>
</html>
