<script>
(function(){
  // Block back button — replace history so back goes nowhere useful
  history.pushState(null, "", window.location.href);
  window.addEventListener("popstate", function() {
    history.pushState(null, "", window.location.href);
  });
  // If page is restored from browser cache (bfcache), verify session is still alive
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      fetch("/api/session-check", { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(d) { if (!d.ok) window.location.replace(d.redirect || "/portal/login"); })
        .catch(function() { window.location.replace("/portal/login"); });
    }
  });
})();
</script>
<script>
/* ── Mobile hamburger nav ── */
function openNav() {
  document.getElementById('topNav').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeNav() {
  var nav = document.getElementById('topNav');
  var overlay = document.getElementById('navOverlay');
  if (nav) nav.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
}
function closeNotif() {
  document.querySelectorAll('.notif-dropdown').forEach(function(d) {
    d.classList.remove('show');
  });
}
document.addEventListener('DOMContentLoaded', function() {
  // Close drawer when any nav link is tapped
  document.querySelectorAll('.top-links a').forEach(function(a) {
    a.addEventListener('click', closeNav);
  });
});
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/assets/sw.js");
    });
  }
</script>
</body>
</html>
