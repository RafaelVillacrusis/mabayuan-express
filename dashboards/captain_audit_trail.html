  <main class="container content-area">
    <div class="dashboard-header">
      <div>
        <h1>Audit Trail</h1>
        <p>All staff actions on requests — date, time, and details recorded.</p>
      </div>
    </div>

    <section class="panel">
      <div class="audit-filter-grid" id="auditFilterForm">
        <input class="input" type="text" id="searchFilter" placeholder="Search transaction, resident, or document…" autocomplete="off" />
        <select class="select" id="actionFilter">
          <option value="">All actions</option>
          <option value="SET_RELEASE_DATE">Set Release Date</option>
          <option value="MARK_CLAIMED">Mark as Claimed</option>
          <option value="CAPTAIN_APPROVE">Captain Approve</option>
          <option value="CAPTAIN_DECLINE">Captain Decline</option>
        </select>
        <input class="input" type="date" id="dateFromFilter" />
        <input class="input" type="date" id="dateToFilter" />
        <div class="button-row audit-filter-actions">
          <button class="btn btn-small" id="applyFilters">Apply</button>
          <button class="btn btn-small btn-ghost" id="resetFilters">Reset</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Date &amp; Time</th>
              <th>Transaction</th>
              <th>Document</th>
              <th>Resident</th>
              <th>Action</th>
              <th>By</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="auditRows" data-empty-colspan="7"></tbody>
        </table>
      </div>
      <div id="auditPg" class="pg-row" style="border-top:1px solid #f0e4e5;"></div>
      <div id="auditMeta" style="margin-top:10px;font-size:0.82rem;color:#6b7280"></div>
    </section>
  </main>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/assets/js/common-pagination.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/captain-audit-trail.js"></script>
<script>
(function(){
  // Block back button — replace history so back goes nowhere useful
  history.pushState(null, "", window.location.href);
  window.addEventListener("popstate", function() {
    history.pushState(null, "", window.location.href);
  });
  // If page is restored from browser cache (bfcache), verify session is still alive
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      fetch("/api/session-check", { credentials: "include" })
        .then(function(r) { return r.json(); })
        .then(function(d) { if (!d.ok) window.location.replace(d.redirect || "/login"); })
        .catch(function() { window.location.replace("/login"); });
    }
  });
})();
</script>
<script>
/* ── Mobile hamburger nav ── */
function openNav() {
  document.getElementById('topNav').classList.add('open');
  document.getElementById('navOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeNav() {
  var nav = document.getElementById('topNav');
  var overlay = document.getElementById('navOverlay');
  if (nav) nav.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
}
function closeNotif() {
  document.querySelectorAll('.notif-dropdown').forEach(function(d) {
    d.classList.remove('show');
  });
}
document.addEventListener('DOMContentLoaded', function() {
  // Close drawer when any nav link is tapped
  document.querySelectorAll('.top-links a').forEach(function(a) {
    a.addEventListener('click', closeNav);
  });
});
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/assets/sw.js");
    });
  }
</script>
</body>
</html>
