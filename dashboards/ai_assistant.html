<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/assets/manifest.json">
  <meta name="theme-color" content="#a64d57">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>AI Assistant — Mabayuan Express</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/resident.css" />
  <link rel="stylesheet" href="/assets/css/staff.css" />
  <style>
    [hidden] { display:none !important; }
    .ai-presets { display:flex; gap:8px; flex-wrap:wrap; }
    .ai-presets button { border:1.5px solid var(--border); background:#fff; color:var(--text); border-radius:999px; padding:7px 14px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
    .ai-presets button:hover, .ai-presets button.on { border-color:var(--primary); color:var(--primary); background:#fdf2f3; }
    .ai-note.ok { background:#e9f9ee; border-color:#a3d9b1; color:#16653a; }
    .ai-output { min-height:520px; }
    .ai-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; }
    .ai-grid .full { grid-column:1 / -1; }
    .ai-note { background:#fdf4dc; border:1px solid #e8d48a; color:#5c4500; border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.55; margin:12px 0; }
    .ai-error { background:#fef2f2; border:1px solid #fecaca; color:#b42318; border-radius:10px; padding:10px 14px; font-size:13.5px; margin-top:12px; }
    .ai-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
    .ai-output { width:100%; box-sizing:border-box; min-height:340px; font-family:ui-monospace, Consolas, monospace; font-size:13.5px; line-height:1.6; }
    .ai-loading { display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:13.5px; }
    .ai-spinner { width:16px; height:16px; border:2.5px solid #eadcdd; border-top-color:var(--primary); border-radius:50%; animation:aiSpin .8s linear infinite; }
    @keyframes aiSpin { to { transform:rotate(360deg); } }
    .ai-result-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-top:14px; }
    .ai-result-grid div { background:#f9f6f6; border:1px solid #f0e4e5; border-radius:12px; padding:10px 12px; }
    .ai-result-grid span { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#9a7a7d; font-weight:700; margin-bottom:3px; }
    .ai-chipcount { display:inline-flex; gap:6px; align-items:center; background:#f9f6f6; border:1px solid #f0e4e5; border-radius:999px; padding:5px 11px; font-size:12.5px; margin:0 6px 6px 0; }
    .ai-chipcount b { color:var(--primary); }
    .ai-msgcell { max-width:380px; white-space:normal; word-break:break-word; }
    .ai-meta { font-size:12px; color:var(--muted); }
  </style>
</head>
<body class="rs-portal st-portal" data-page="ai">
<div class="page-shell">
  <header class="topbar rs-topbar">
    <a class="brand" id="rsBrand" href="/" aria-label="Mabayuan Express">
      <div class="brand-mark" style="background:transparent;padding:0;overflow:visible;">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="3" width="20" height="26" rx="3" fill="rgba(255,255,255,0.22)"/>
          <path d="M20 3 L26 9 L20 9 Z" fill="rgba(255,255,255,0.18)"/>
          <path d="M20 3 L20 9 L26 9" stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="none"/>
          <line x1="10" y1="14" x2="22" y2="14" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="18" x2="22" y2="18" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="22" x2="17" y2="22" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="26" cy="28" r="7" fill="#fff"/>
          <polyline points="22.5,28 25,30.5 29.5,25.5" stroke="#8b2131" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="brand-copy"><div>Mabayuan Express</div><small id="brandRole">Portal</small></div>
    </a>
    <nav class="rs-nav" id="rsNav" aria-label="Main navigation"></nav>
    <div class="rs-user">
      <button type="button" class="rs-user-btn" id="rsUserBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
        <span class="rs-avatar" id="rsAvatar">·</span><span class="rs-user-name" id="rsUserName"></span><span class="rs-caret" aria-hidden="true">▾</span>
      </button>
      <div class="rs-user-menu" id="rsUserMenu" hidden>
        <div class="rs-user-info"><strong id="rsMenuName"></strong><span id="rsMenuRole"></span></div>
        <form action="/auth/logout" method="POST"><button class="rs-logout" type="submit">↪ Log out</button></form>
      </div>
    </div>
  </header>

  <main class="container content-area">
    <div class="st-head">
      <div>
        <h1>🤖 AI Report Generator</h1>
        <p>Create summary reports from Mabayuan Express records, or draft an announcement. Figures are calculated directly from the database; AI only writes the commentary.</p>
      </div>
    </div>

    <section class="panel">
      <form id="reportForm" novalidate>
        <div class="ai-grid">
          <div class="full">
            <label class="form-label" for="reportType">What do you want to create?</label>
            <select class="select" id="reportType">
              <option value="requests">📄 Summary of document requests</option>
              <option value="inquiries">💬 Summary of resident questions (from the chatbot)</option>
              <option value="announcement">📢 Draft an announcement</option>
            </select>
          </div>
          <div class="full" data-for="range">
            <span class="form-label">Quick range</span>
            <div class="ai-presets" role="group" aria-label="Quick date ranges">
              <button type="button" data-preset="30d">Last 30 days</button>
              <button type="button" data-preset="month">This month</button>
              <button type="button" data-preset="lastmonth">Last month</button>
              <button type="button" data-preset="year">This year</button>
            </div>
          </div>
          <div data-for="range"><label class="form-label" for="dateFrom">From</label><input class="input" type="date" id="dateFrom"></div>
          <div data-for="range"><label class="form-label" for="dateTo">To</label><input class="input" type="date" id="dateTo"></div>
          <div data-for="announcement" hidden>
            <label class="form-label" for="audience">Audience</label>
            <select class="select" id="audience"><option value="residents">Residents</option><option value="staff">Barangay personnel</option><option value="all">Everyone</option></select>
          </div>
          <div class="full" data-for="announcement" hidden>
            <label class="form-label" for="annTopic">Topic *</label>
            <input class="input" id="annTopic" maxlength="300" placeholder="e.g. Free medical mission at the barangay hall">
          </div>
          <div class="full" data-for="announcement" hidden>
            <label class="form-label" for="annDetails">Details <span class="ai-meta">(date, time, place, who can join, what to bring)</span></label>
            <textarea class="textarea input" id="annDetails" rows="4" maxlength="1500" placeholder="Saturday, Nov 22, 8AM–12NN at the Barangay Mabayuan covered court. Bring a valid ID."></textarea>
          </div>
        </div>
        <div class="ai-actions">
          <button class="btn" type="submit" id="reportBtn">Generate report</button>
          <span class="ai-loading" id="reportLoading" hidden><span class="ai-spinner"></span> <span id="reportLoadingText">Calculating figures…</span></span>
        </div>
      </form>
      <div class="ai-error" id="reportError" hidden></div>
      <div id="reportOutputWrap" hidden>
        <div class="ai-note" id="reportNote"></div>
        <textarea class="textarea input ai-output" id="reportOutput" aria-label="Generated report (editable)"></textarea>
        <div class="ai-actions">
          <button class="btn btn-outline" type="button" id="copyReport">📋 Copy text</button>
          <button class="btn btn-outline" type="button" id="printReport">🖨 Print</button>
          <span class="ai-meta" id="reportMeta"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<nav class="rs-bottom" id="rsBottom" aria-label="Quick navigation"></nav>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/ai-assistant.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("/assets/sw.js"); });
  }
</script>
</body>
</html>
